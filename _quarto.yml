project:
  type: website
  output-dir: _site
  # Only .qmd pages are published; DESIGN.md and PRODUCT.md are design notes, not pages.
  render:
    - "**/*.qmd"
  resources:
    - "**/*-assets/**"
  # Lecture pages start as `draft: true`; drop prev/next links that point at them.
  post-render:
    - scripts/strip_draft_links.py

website:
  title: "mdrat"
  description: "Paper reproductions, projects, and lecture notes on machine learning, math, data and systems."
  site-url: https://minhboba.github.io
  favicon: assets/favicon.svg
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false

  navbar:
    left:
      - text: Home
        href: index.qmd
      # Each tab opens a dropdown instead of navigating. Add a course here when
      # you add its folder; lectures are reached from the course page.
      - text: Lab
        menu:
          - text: Overview
            href: lab/index.qmd
          - text: "---"
          - text: Paper reproductions
            href: lab/index.qmd#paper-reproductions
          - text: Projects
            href: lab/index.qmd#projects
      - text: Machine Learning
        menu:
          - text: Overview
            href: ml/index.qmd
          - text: "---"
          - text: Topics
          - text: "Classical Machine Learning"
            href: ml/cs229/index.qmd
          - text: "Deep Learning Theory"
            href: ml/deep-learning-book/index.qmd
          - text: "Deep Learning Systems"
            href: ml/dlsys/index.qmd
          - text: "Natural Language Processing"
            href: ml/nlp/index.qmd
          - text: "Reinforcement Learning"
            href: ml/rl/index.qmd
          - text: "Large Language Models"
            href: ml/cs336/index.qmd
          - text: "Efficient ML"
            href: ml/efficient-ml/index.qmd
          - text: "JAX"
            href: ml/jax/index.qmd
          - text: "LLM Agents"
            href: ml/llm-agents/index.qmd
      - text: Math
        menu:
          - text: Overview
            href: math/index.qmd
          - text: "---"
          - text: Topics
          - text: "Calculus"
            href: math/calculus/index.qmd
          - text: "Linear Algebra"
            href: math/mit1806/index.qmd
          - text: "Probability"
            href: math/mit6041/index.qmd
          - text: "Matrix Methods for Data"
            href: math/mit18065/index.qmd
          - text: "Convex Optimization"
            href: math/ee364a/index.qmd
          - text: "Information Theory"
            href: math/information-theory/index.qmd
      - text: Data
        menu:
          - text: Overview
            href: data/index.qmd
          - text: "---"
          - text: Data structures and algorithms
            href: data/index.qmd#data-structures-and-algorithms
          - text: Problems
            href: data/index.qmd#problems
          - text: Power BI reports
            href: data/index.qmd#power-bi-reports
      - text: System
        menu:
          - text: Overview
            href: system/index.qmd
          - text: "---"
          - text: Case studies
            href: system/index.qmd#case-studies
          - text: Applications
            href: system/index.qmd#applications
    right:
      - icon: github
        href: https://github.com/MinhBoba
        aria-label: GitHub profile

  # One auto-generated sidebar per tab. Quarto shows the sidebar whose
  # contents include the current page, so each tab gets its own tree.
  sidebar:
    - id: lab
      title: Lab
      style: docked
      contents: lab
    - id: ml
      title: Machine Learning
      style: docked
      contents: ml
    - id: math
      title: Math
      style: docked
      contents: math
    - id: data
      title: Data
      style: docked
      contents: data
    - id: system
      title: System
      style: docked
      contents: system

  page-footer:
    left: "© 2026 mdrat"

format:
  html:
    theme:
      light: [cosmo, theme/light.scss]
      dark: [cosmo, theme/dark.scss]
    css: styles.css
    respect-user-color-scheme: true
    include-after-body:
      - _includes/nav-a11y.html
      - _includes/katex-loader.html
      - _includes/owner-edit.html
      - _includes/notation.html
    toc: true
    toc-location: right
    toc-depth: 3
    code-fold: false
    code-tools: false
    code-copy: true
    code-overflow: wrap
    highlight-style: a11y
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/"
    smooth-scroll: false
    link-external-newwindow: true
    lang: en

execute:
  freeze: auto
