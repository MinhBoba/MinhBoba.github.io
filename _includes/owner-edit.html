<script>
// Source panel for study pages.
// Everyone gets a </> button that shows the page's Markdown/LaTeX source
// read-only. The owner signs in once with a GitHub token that has push access
// to this repo; then the panel becomes an editor and Save commits the .qmd to
// main, after which CI re-renders the site. GitHub enforces who can write.
(function () {
  "use strict";

  var REPO = "MinhBoba/MinhBoba.github.io";
  var BRANCH = "main";
  var TOKEN_KEY = "mj-owner-token";
  var API_REPO = "https://api.github.com/repos/" + REPO;
  var API_FILE = API_REPO + "/contents/";
  var RAW_FILE = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/";
  var MARKED_SRC = "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js";
  var PREVIEW_DELAY_MS = 250;

  if (!/\bdomain-/.test(document.body.className)) return;

  // ---- Storage and paths -------------------------------------------------
  function readToken() {
    try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }
  function writeToken(value) {
    try {
      if (value) localStorage.setItem(TOKEN_KEY, value);
      else localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* storage blocked: sign-in lasts this page view only */ }
  }

  function sourcePath() {
    var path = decodeURIComponent(location.pathname).replace(/^\/+/, "");
    if (path === "" || path.endsWith("/")) path += "index.html";
    return path.replace(/\.html$/, ".qmd");
  }

  // ---- GitHub ------------------------------------------------------------
  function api(url, token, options) {
    var opts = Object.assign({}, options);
    opts.headers = Object.assign({
      Accept: "application/vnd.github+json",
      Authorization: "Bearer " + token
    }, opts.headers);
    return fetch(url, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) {
          var err = new Error(body.message || ("GitHub returned " + res.status));
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function decodeBase64(b64) {
    var bin = atob(b64.replace(/\n/g, ""));
    return new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); }));
  }
  function encodeBase64(text) {
    var bin = "";
    new TextEncoder().encode(text).forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }

  // Public read for visitors: no token, no API rate limit.
  function loadPublic(path) {
    return fetch(RAW_FILE + path, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("source not found (" + res.status + ")");
      return res.text().then(function (text) { return { text: text, sha: null }; });
    });
  }
  // Owner read: also returns the blob sha needed to save.
  function loadOwned(path, token) {
    return api(API_FILE + path + "?ref=" + BRANCH, token).then(function (file) {
      return { text: decodeBase64(file.content), sha: file.sha };
    });
  }

  // ---- Preview -----------------------------------------------------------
  var markedReady = null;
  function loadMarked() {
    if (window.marked) return Promise.resolve();
    if (!markedReady) {
      markedReady = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = MARKED_SRC;
        s.onload = resolve;
        s.onerror = function () { markedReady = null; reject(new Error("could not load the previewer")); };
        document.head.appendChild(s);
      });
    }
    return markedReady;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function renderMath(tex, display) {
    if (!window.katex) return escapeHtml(tex);
    return window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
  }
  function renderPreview(source) {
    var stash = [];
    function hold(html) { stash.push(html); return "@@MJMATH" + (stash.length - 1) + "@@"; }
    var text = source
      .replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, "")
      .replace(/\{\{<\s*(\w+)[^>]*>\}\}/g, function (_, name) {
        return hold('<div class="mj-edit-shortcode">' + escapeHtml(name) + " shortcode</div>");
      })
      .replace(/^:::.*$/gm, "")
      .replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) { return "\n\n" + hold(renderMath(tex, true)) + "\n\n"; })
      .replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*[^\s$])?)\$/g, function (_, pre, tex) {
        return pre + hold(renderMath(tex, false));
      });
    return window.marked.parse(text).replace(/@@MJMATH(\d+)@@/g, function (_, i) { return stash[Number(i)]; });
  }

  // ---- Panel -------------------------------------------------------------
  function buildPanel(path) {
    var panel = document.createElement("div");
    panel.className = "mj-edit-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", "Source of " + path);
    panel.innerHTML =
      '<div class="mj-edit-bar">' +
        '<span class="mj-edit-path"></span>' +
        '<span class="mj-edit-status" role="status"></span>' +
        '<button type="button" class="mj-edit-signin">Sign in to edit</button>' +
        '<button type="button" class="mj-edit-save" disabled>Save</button>' +
        '<button type="button" class="mj-edit-close">Close</button>' +
        '<button type="button" class="mj-edit-signout">Sign out</button>' +
      "</div>" +
      '<div class="mj-edit-body">' +
        '<textarea class="mj-edit-source" spellcheck="false" readonly aria-label="Markdown and LaTeX source">Loading…</textarea>' +
        '<div class="mj-edit-preview" aria-label="Preview"></div>' +
      "</div>";
    panel.querySelector(".mj-edit-path").textContent = path;
    return panel;
  }

  function openPanel() {
    var path = sourcePath();
    var toggle = document.querySelector(".mj-edit-toggle");
    var panel = buildPanel(path);
    var el = {
      source: panel.querySelector(".mj-edit-source"),
      preview: panel.querySelector(".mj-edit-preview"),
      status: panel.querySelector(".mj-edit-status"),
      save: panel.querySelector(".mj-edit-save"),
      signin: panel.querySelector(".mj-edit-signin"),
      signout: panel.querySelector(".mj-edit-signout")
    };
    var state = { sha: null, original: "", timer: null };

    document.body.appendChild(panel);
    document.body.classList.add("mj-editing");
    if (toggle) toggle.setAttribute("aria-pressed", "true");

    function setStatus(msg, isError) {
      el.status.textContent = msg;
      el.status.classList.toggle("is-error", !!isError);
    }
    function isOwner() { return state.sha !== null; }
    function isDirty() { return isOwner() && el.source.value !== state.original; }
    function setMode(owner) {
      panel.classList.toggle("is-owner", owner);
      el.source.readOnly = !owner;
      el.signin.hidden = owner;
      el.save.hidden = !owner;
      el.signout.hidden = !owner;
    }
    function refresh() {
      el.save.disabled = !isDirty();
      if (!isOwner()) return;
      clearTimeout(state.timer);
      state.timer = setTimeout(function () {
        try { el.preview.innerHTML = renderPreview(el.source.value); }
        catch (e) { setStatus("Preview error: " + e.message, true); }
      }, PREVIEW_DELAY_MS);
    }
    function show(file, owner) {
      state.sha = owner ? file.sha : null;
      state.original = file.text;
      el.source.value = file.text;
      setMode(owner);
      setStatus(owner ? "Editing" : "Read-only");
      refresh();
    }

    function loadAsOwner(token) {
      setStatus("Loading…");
      return Promise.all([loadOwned(path, token), loadMarked()]).then(function (r) {
        show(r[0], true);
        el.source.focus();
      });
    }
    function loadAsVisitor() {
      return loadPublic(path).then(function (file) { show(file, false); });
    }

    function signIn() {
      var token = window.prompt(
        "Paste a fine-grained GitHub token with Contents: Read and write on " + REPO +
        ".\nIt is stored only in this browser."
      );
      if (!token) return;
      token = token.trim();
      setStatus("Checking token…");
      api(API_REPO, token).then(function (repo) {
        if (repo.permissions && repo.permissions.push === false) {
          throw new Error("this token cannot write to " + REPO);
        }
        writeToken(token);
        return loadAsOwner(token);
      }).catch(function (err) {
        setStatus("Sign-in failed: " + err.message, true);
      });
    }

    function save() {
      if (!isDirty()) return;
      el.save.disabled = true;
      setStatus("Saving…");
      api(API_FILE + path, readToken(), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "docs: edit " + path,
          content: encodeBase64(el.source.value),
          sha: state.sha,
          branch: BRANCH
        })
      }).then(function (res) {
        state.sha = res.content.sha;
        state.original = el.source.value;
        setStatus("Committed " + res.commit.sha.slice(0, 7) + ". The site rebuilds in about 2 minutes.");
      }).catch(function (err) {
        var hint = err.status === 409 ? " The file changed on GitHub; close and reopen to load it." : "";
        setStatus("Save failed: " + err.message + hint, true);
        el.save.disabled = !isDirty();
      });
    }

    function close() {
      if (isDirty() && !window.confirm("Discard unsaved changes?")) return;
      document.removeEventListener("keydown", onKey);
      panel.remove();
      document.body.classList.remove("mj-editing");
      if (toggle) { toggle.setAttribute("aria-pressed", "false"); toggle.focus(); }
    }

    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && isOwner()) { e.preventDefault(); save(); }
    }

    document.addEventListener("keydown", onKey);
    el.source.addEventListener("input", refresh);
    el.save.addEventListener("click", save);
    el.signin.addEventListener("click", signIn);
    panel.querySelector(".mj-edit-close").addEventListener("click", close);
    el.signout.addEventListener("click", function () {
      if (isDirty() && !window.confirm("Discard unsaved changes and sign out?")) return;
      writeToken(null);
      setStatus("Signed out");
      loadAsVisitor().catch(function (err) { setStatus("Could not load source: " + err.message, true); });
    });

    setMode(false);
    var token = readToken();
    var first = token
      ? loadAsOwner(token).catch(function (err) {
          if (err.status === 401) writeToken(null);
          return loadAsVisitor().then(function () {
            setStatus("Signed out (" + err.message + "). Read-only", true);
          });
        })
      : loadAsVisitor();
    first.catch(function (err) {
      el.source.value = "";
      setStatus("Could not load " + path + ": " + err.message, true);
    });
  }

  // ---- Button ------------------------------------------------------------
  function addButton() {
    var title = document.querySelector("#title-block-header h1.title") ||
                document.querySelector("main h1");
    if (!title || document.querySelector(".mj-edit-toggle")) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mj-edit-toggle";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", "View page source");
    btn.title = "View source";
    btn.textContent = "</>";
    btn.addEventListener("click", openPanel);
    title.insertAdjacentElement("afterend", btn);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", addButton);
  else addButton();
})();
</script>
