<script>
// Owner-only source editor for study pages.
// The button appears only in a browser that holds a GitHub token with push
// access to this repo. Unlock once by opening any study page with #owner in
// the URL. Saving commits the .qmd to main; CI re-renders the site.
(function () {
  "use strict";

  var REPO = "MinhBoba/MinhBoba.github.io";
  var BRANCH = "main";
  var TOKEN_KEY = "mj-owner-token";
  var API = "https://api.github.com/repos/" + REPO + "/contents/";
  var MARKED_SRC = "https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js";
  var PREVIEW_DELAY_MS = 250;

  if (!/\bdomain-/.test(document.body.className)) return;

  function readToken() {
    try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }
  function writeToken(value) {
    try {
      if (value) localStorage.setItem(TOKEN_KEY, value);
      else localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* storage blocked: owner mode lasts this page view only */ }
  }

  function sourcePath() {
    var path = decodeURIComponent(location.pathname).replace(/^\/+/, "");
    if (path === "" || path.endsWith("/")) path += "index.html";
    return path.replace(/\.html$/, ".qmd");
  }

  function api(path, options) {
    var token = readToken();
    var opts = Object.assign({ headers: {} }, options);
    opts.headers = Object.assign({
      Accept: "application/vnd.github+json",
      Authorization: "Bearer " + token
    }, opts.headers);
    return fetch(path, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) {
          var err = new Error(body.message || ("GitHub returned " + res.status));
          err.status = res.status;
          throw err;
        }
        return body;
      });
    });
  }

  function decodeBase64(b64) {
    var bin = atob(b64.replace(/\n/g, ""));
    var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    return new TextDecoder().decode(bytes);
  }
  function encodeBase64(text) {
    var bytes = new TextEncoder().encode(text);
    var bin = "";
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }

  // ---- Unlock ----------------------------------------------------------
  function unlock() {
    var token = window.prompt(
      "Owner mode: paste a fine-grained GitHub token with Contents read/write on " + REPO + ".\n" +
      "It is stored only in this browser."
    );
    if (!token) return;
    writeToken(token.trim());
    api("https://api.github.com/repos/" + REPO).then(function (repo) {
      if (!repo.permissions || !repo.permissions.push) throw new Error("Token has no push access.");
      history.replaceState(null, "", location.pathname + location.search);
      addButton();
    }).catch(function (err) {
      writeToken(null);
      window.alert("Owner mode not enabled: " + err.message);
    });
  }

  // ---- Button ----------------------------------------------------------
  function addButton() {
    if (document.querySelector(".mj-edit-toggle")) return;
    var title = document.querySelector("#title-block-header h1.title") ||
                document.querySelector("main h1");
    if (!title) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mj-edit-toggle";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", "Edit page source");
    btn.title = "Edit source (owner only)";
    btn.textContent = "</>";
    btn.addEventListener("click", openEditor);
    title.insertAdjacentElement("afterend", btn);
  }

  // ---- Preview ---------------------------------------------------------
  var markedReady = null;
  function loadMarked() {
    if (window.marked) return Promise.resolve();
    if (markedReady) return markedReady;
    markedReady = new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = MARKED_SRC;
      s.onload = resolve;
      s.onerror = function () { reject(new Error("Could not load the Markdown previewer.")); };
      document.head.appendChild(s);
    });
    return markedReady;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function renderMath(tex, display) {
    if (!window.katex) return escapeHtml(tex);
    return window.katex.renderToString(tex, { displayMode: display, throwOnError: false });
  }

  function renderPreview(source) {
    var math = [];
    function stash(html) { math.push(html); return "@@MJMATH" + (math.length - 1) + "@@"; }

    var text = source
      .replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, "")
      .replace(/\{\{<\s*(\w+)[^>]*>\}\}/g, function (_, name) {
        return stash('<div class="mj-edit-shortcode">' + escapeHtml(name) + " shortcode</div>");
      })
      .replace(/^:::.*$/gm, "")
      .replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) { return "\n\n" + stash(renderMath(tex, true)) + "\n\n"; })
      .replace(/(^|[^\\$])\$([^\s$](?:[^$\n]*[^\s$])?)\$/g, function (_, pre, tex) {
        return pre + stash(renderMath(tex, false));
      });

    var html = window.marked.parse(text);
    return html.replace(/@@MJMATH(\d+)@@/g, function (_, i) { return math[Number(i)]; });
  }

  // ---- Editor ----------------------------------------------------------
  function openEditor() {
    var path = sourcePath();
    var toggle = document.querySelector(".mj-edit-toggle");
    var sha = null;
    var original = "";

    var panel = document.createElement("div");
    panel.className = "mj-edit-panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", "Edit " + path);
    panel.innerHTML =
      '<div class="mj-edit-bar">' +
        '<span class="mj-edit-path"></span>' +
        '<span class="mj-edit-status" role="status"></span>' +
        '<button type="button" class="mj-edit-save" disabled>Save</button>' +
        '<button type="button" class="mj-edit-close">Close</button>' +
        '<button type="button" class="mj-edit-signout">Sign out</button>' +
      "</div>" +
      '<div class="mj-edit-body">' +
        '<textarea class="mj-edit-source" spellcheck="false" aria-label="Markdown and LaTeX source" disabled>Loading…</textarea>' +
        '<div class="mj-edit-preview" aria-label="Preview"></div>' +
      "</div>";
    panel.querySelector(".mj-edit-path").textContent = path;
    document.body.appendChild(panel);
    document.body.classList.add("mj-editing");
    if (toggle) toggle.setAttribute("aria-pressed", "true");

    var source = panel.querySelector(".mj-edit-source");
    var preview = panel.querySelector(".mj-edit-preview");
    var status = panel.querySelector(".mj-edit-status");
    var saveBtn = panel.querySelector(".mj-edit-save");
    var timer = null;

    function setStatus(msg, isError) {
      status.textContent = msg;
      status.classList.toggle("is-error", !!isError);
    }
    function isDirty() { return source.value !== original; }
    function refresh() {
      saveBtn.disabled = !isDirty();
      clearTimeout(timer);
      timer = setTimeout(function () {
        try { preview.innerHTML = renderPreview(source.value); }
        catch (e) { setStatus("Preview error: " + e.message, true); }
      }, PREVIEW_DELAY_MS);
    }

    function close() {
      if (isDirty() && !window.confirm("Discard unsaved changes?")) return;
      document.removeEventListener("keydown", onKey);
      panel.remove();
      document.body.classList.remove("mj-editing");
      if (toggle) { toggle.setAttribute("aria-pressed", "false"); toggle.focus(); }
    }

    function save() {
      if (!isDirty() || !sha) return;
      saveBtn.disabled = true;
      setStatus("Saving…");
      api(API + path, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "docs: edit " + path,
          content: encodeBase64(source.value),
          sha: sha,
          branch: BRANCH
        })
      }).then(function (res) {
        sha = res.content.sha;
        original = source.value;
        setStatus("Committed " + res.commit.sha.slice(0, 7) + ". The site rebuilds in about 2 minutes.");
      }).catch(function (err) {
        var hint = err.status === 409 ? " The file changed on GitHub; close and reopen to load it." : "";
        setStatus("Save failed: " + err.message + hint, true);
        saveBtn.disabled = !isDirty();
      });
    }

    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
    }

    document.addEventListener("keydown", onKey);
    source.addEventListener("input", refresh);
    saveBtn.addEventListener("click", save);
    panel.querySelector(".mj-edit-close").addEventListener("click", close);
    panel.querySelector(".mj-edit-signout").addEventListener("click", function () {
      if (isDirty() && !window.confirm("Discard unsaved changes and sign out?")) return;
      original = source.value;
      writeToken(null);
      close();
      if (toggle) toggle.remove();
    });

    Promise.all([api(API + path + "?ref=" + BRANCH), loadMarked()]).then(function (results) {
      var file = results[0];
      sha = file.sha;
      original = decodeBase64(file.content);
      source.value = original;
      source.disabled = false;
      source.focus();
      refresh();
    }).catch(function (err) {
      source.value = "";
      setStatus("Could not load " + path + ": " + err.message, true);
    });
  }

  // Adding #owner to an open page only changes the hash (no reload), so
  // listen for that as well as checking on load.
  window.addEventListener("hashchange", function () {
    if (location.hash === "#owner") unlock();
  });
  if (location.hash === "#owner") unlock();
  else if (readToken()) addButton();
})();
</script>
